name: Run Ruby on Rails & React Tests before Deploying to Railway

on:
  push:
    branches: [master]

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  ruby_on_rails_test:
    name: Run Ruby on Rails Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        # Docker Hub image
        image: postgres:18-bookworm
        # Set the password for the Postgres service
        env:
          POSTGRES_PASSWORD: postgres
        # Maps TCP port 5432 on service container to the host
        ports:
          - 5432:5432
        # Set health checks to wait until Postgres has started
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    # Apply the following ENV vars to all of the following steps of this job
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/resume_react_rails-test
      BUNDLE_DEPLOYMENT: true
      BUNDLE_WITHOUT: development
      BUNDLE_SIMULATE_VERSION: "4"

    steps:
      - uses: actions/checkout@v7
      - name: Set up Ruby 3.4.12 via `.ruby-version` and Install Gems via Bundler
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
      - name: Setup Database
        run: bin/rails db:setup
      - name: Run Ruby on Rails tests
        run: bin/rails test

  react_tests:
    name: Run React Tests
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [24, 26]

    steps:
      - uses: actions/checkout@v7
      - name: Use PNPM 12 with NodeJS ${{ matrix.node-version }}
        uses: pnpm/setup@v3
        with:
          working-directory: react-client
          cache: true
          save-cache: ${{ matrix.node-version == '24' }}
      - name: Run React tests
        run: pnpm -C react-client test

  deploy:
    name: Deploy to Railway
    needs: [ruby_on_rails_test, react_tests]
    runs-on: ubuntu-latest
    environment: production
    strategy:
      matrix:
        node-version: [24]

    steps:
      - uses: actions/checkout@v7
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
      - name: Install Railway CLI
        run: npm i -g @railway/cli
      - name: Deploy Portfolio to Railway
        run: railway up --service web
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
